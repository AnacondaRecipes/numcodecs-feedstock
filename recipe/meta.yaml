{% set name = "numcodecs" %}
{% set version = "0.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e8db2e337bdafd3bb5f891a2543b53b2b36a509ce9d587af2846db3715b6c8b9

build:
  number: 0
  skip: true  # [py<312]
  script:
    - export DISABLE_NUMCODECS_AVX2=""  # [unix]
    - export DISABLE_NUMCODECS_SSE2=""  # [osx and arm64]
    - set DISABLE_NUMCODECS_AVX2=""  # [win]
    - set "PKG_CONFIG_PATH=%LIBRARY_LIB%\pkgconfig"  # [win]
    - {{ PYTHON }} -m build --wheel --no-isolation --skip-dependency-check -Csetup-args=-Dsystem_blosc=enabled -Csetup-args=-Dsystem_zstd=enabled -Csetup-args=-Dsystem_lz4=enabled
    - {{ PYTHON }} -c "import glob; wheel = glob.glob('dist/*.whl')[0]; import subprocess, sys; sys.exit(subprocess.call([sys.executable, '-m', 'pip', 'install', '--no-deps', '-vv', wheel]))"

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - ninja-base
    - pkg-config
  host:
    - python
    - pip
    - python-build
    - cython >=3.1
    - setuptools-scm >=6.2
    - numpy {{ numpy }}
    - blosc {{ blosc }}
    - lz4-c {{ lz4_c }}
    - zstd {{ zstd }}
    - meson-python >=0.17
    - meson >=1.6.0
  run:
    - python
    # numcodecs/__init__.py requires msgpack,
    # see https://github.com/zarr-developers/numcodecs/blob/v0.16.5/numcodecs/__init__.py#L134
    - msgpack-python
    - numpy >=2.0
    # bounds set through run_exports
    - blosc
    - lz4-c
    - zstd
    - typing_extensions
  run_constrained:
    - crc32c >=2.7
    - pcodec >=1,<2
    - zfpy >=1.0.0
    - google-crc32c >=1.5

test:
  source_files:
    - tests
    - fixture
  requires:
    - pytest
    - importlib_metadata
    - pip
    - pyzstd
  imports:
    - numcodecs
    - numcodecs.blosc
    - numcodecs.lz4
    - numcodecs.zstd
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests

about:
  home: https://github.com/zarr-developers/numcodecs
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A Python package providing buffer compression and transformation codecs for use in data storage and communication applications.
  description: |
    Numcodecs is a Python package providing buffer compression and transformation codecs for use in data storage and communication applications. These include:
    Compression codecs, e.g., Zlib, BZ2, LZMA, ZFPY and Blosc.
    Pre-compression filters, e.g., Delta, Quantize, FixedScaleOffset, PackBits, Categorize.
    Integrity checks, e.g., CRC32, Adler32.
    All codecs implement the same API, allowing codecs to be organized into pipelines in a variety of ways.
  dev_url: https://github.com/zarr-developers/numcodecs
  doc_url: https://numcodecs.readthedocs.io/en/stable

extra:
  recipe-maintainers:
    - alimanfoo
    - jakirkham
    - jrbourbeau
  skip-lints:
    # build uses `python -m build` + `pip install dist/*.whl` (meson-python pattern,
    # same as scipy-feedstock/numpy-feedstock); linter does not recognize this form
    - deprecated_python_install_command
    - pip_install_args
